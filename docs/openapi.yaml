          "404": {
            "description": "Карта не найдена",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse",
                  "example": {
                    "error": "Card with number 6016 not found"
                  }
                }
              }
            }
          },
          "409": {
            "description": "Ошибка уникальности или целостности данных",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse",
