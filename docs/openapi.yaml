  "paths": {
    "/admin/cards/block": {
      "put": {
        "tags": [
          "Админ: Карты"
        ],
        "summary": "Блокировка карты",
        "description": "Поддерживается блокировка как по запросу от пользователя, так и без него.\nДля блокировки по запросу пользователя - передать в параметрах Id запроса на блокировку.\nДля блокировки без запроса от пользователя - указать в теле запроса номер карты, в параметрах запроса при этом ничего не указывать.",
        "operationId": "blockCard",
        "parameters": [
          {
            "name": "requestId",
            "in": "query",
            "description": "Номер запроса на блокировку",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int64",
              "exclusiveMinimum": 0
            },
            "example": 1
          }
        ],
        "requestBody": {
          "description": "Номер карты",
          "content": {
            "text/plain": {
              "schema": {
                "type": "string",
                "example": 1234567876543210
              }
            },
            "application/json": {
              "schema": {
                "type": "string"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Карта заблокирована",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CardDto",
                  "example": {
                    "number": "**** **** **** 1234",
                    "ownerId": 1,
                    "created": "2025-09-28T12:00",
                    "expiration": "2026-09-28",
                    "status": "BLOCKED",
                    "balance": 1234.56
                  }
                }
              }
            }
          },
          "400": {
            "description": "Некорректный запрос",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse",
                  "example": {
                    "error": "Необходимо указать id запроса на блокировку либо номер карты"
                  }
                }
              }
            }
          },
          "404": {
            "description": "Не найдена карта или не найден запрос на блокировку",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                },
                "examples": {
                  "Не найдена карта": {
                    "description": "Не найдена карта",
                    "value": {
                      "error": "Card with number **** **** **** 1234 not found"
                    }
                  },
                  "Не найден запрос на блокировку": {
                    "description": "Не найден запрос на блокировку",
                    "value": {
                      "error": "Card blocking request with id 42 not found"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/admin/cards/activate": {
      "put": {
        "tags": [
          "Админ: Карты"
        ],
        "summary": "Активация карты",
        "operationId": "activateCard",
        "requestBody": {
          "description": "Номер карты",
          "content": {
            "text/plain": {
              "schema": {
                "type": "string",
                "example": 1234567876543210
              }
            },
            "application/json": {
              "schema": {
                "type": "string"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Карта активирована",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CardDto"
                }
              }
            }
          },
          "404": {
            "description": "Карта не найдена",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse",
                  "example": {
                    "error": "Card with number **** **** **** 1234 not found"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/user/cards/transfer": {
      "post": {
        "tags": [
          "User: карты"
        ],
        "summary": "Перевести деньги между картами",
        "operationId": "transferMoney",
        "requestBody": {
          "description": "Параметры перевода. Используются частичные номера карт. Обе карты должны иметь статус ACTIVE. Сумма перевода должна быть положительная",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MoneyTransferRequest",
                "example": {
                  "fromCardNumber": "1234",
                  "toCardNumber": "5678",
                  "amount": 100
                }
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Перевод выполнен",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CardBalanceDto"
                }
              }
            }
          },
          "400": {
            "description": "Некорректный запрос",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse",
                  "example": {
                    "error": "Поле amount должно быть больше 0."
                  }
                }
              }
            }
          },
          "404": {
            "description": "Карта не найдена",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse",
                  "example": {
                    "error": "Card with number 6016 not found"
                  }
                }
              }
            }
          },
          "406": {
            "description": "Невозможно выполнить перевод",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                },
                "examples": {
                  "Недостаточно средств на карте": {
                    "description": "Недостаточно средств на карте",
                    "value": {
                      "error": "Insufficient funds on the card to perform the operation"
                    }
                  },
                  "Карта не активна": {
                    "description": "Карта не активна",
                    "value": {
                      "error": "The card **** **** **** 1895 status is not ACTIVE"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/user/cards/block": {
      "post": {
        "tags": [
